<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -5 48 48" width="48" height="48" role="img" aria-label="Awesome Aragón">
  <!-- One repeat of the sebka lattice in banner.svg (pattern id "c-sebka"): the
       terracotta lozenge, its light highlight, the green glazed disc in the
       middle and the two white discs at the tips, same paths, gradients and
       colours. Changed: the 0.7 highlight and the 0.6 and 0.8 disc outlines are
       2 units wide so they survive at 26 px, and the white discs are drawn
       whole instead of cut by the tile edge. Ids carry an aw- prefix. -->
  <defs>
    <radialGradient id="aw-logo-glaze-g" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5fc394"/><stop offset="1" stop-color="#2f8a63"/>
    </radialGradient>
    <radialGradient id="aw-logo-glaze-w" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#cfc4a6"/>
    </radialGradient>
  </defs>
  <path d="M20,0 Q26,13 40,19 Q26,25 20,38 Q14,25 0,19 Q14,13 20,0 Z" fill="none" stroke="#c06f43" stroke-width="4.4" stroke-linejoin="round"/>
  <path d="M20,0 Q26,13 40,19 Q26,25 20,38 Q14,25 0,19 Q14,13 20,0 Z" fill="none" stroke="#e39a68" stroke-width="2" opacity="0.55" transform="translate(0,-1)"/>
  <circle cx="20" cy="19" r="4.6" fill="url(#aw-logo-glaze-g)" stroke="#3a2536" stroke-width="2"/>
  <circle cx="0" cy="19" r="3" fill="url(#aw-logo-glaze-w)" stroke="#3a2536" stroke-width="2"/>
  <circle cx="40" cy="19" r="3" fill="url(#aw-logo-glaze-w)" stroke="#3a2536" stroke-width="2"/>
</svg>
